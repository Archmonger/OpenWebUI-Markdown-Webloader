name: Docker Publish (GHCR)

# Build and push a multi-arch image to the GitHub Container Registry on release
# tags (and on every push to main for a `latest` pointer). Each platform is
# built on a *native* runner (no QEMU), pushed by digest, and the per-platform
# digests are then merged into one manifest list. This is what makes
# `docker pull` work on linux/arm64 (issue #4) as well as linux/amd64.
#
# Uses OIDC so no long-lived PAT is required for GitHub-hosted actions.

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners keep the Rust `dom_smoothie_cli` compile at full
          # speed. QEMU-emulating arm64 on an x64 runner would take far longer.
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_name: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_name: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata is used here for image labels (and the canonical image name);
      # the final tags are only applied by the merge job.
      - name: Docker metadata (labels and canonical name)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name-canonical=true,push-by-digest=true
          cache-from: type=gha,scope=${{ matrix.digest_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.digest_name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.digest_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # GHCR requires lowercase repository names, but GitHub owners may contain
      # uppercase letters (e.g. `Archmonger`). Normalize once for every step.
      - name: Normalize image reference
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${args[@]}"

      - name: Inspect manifest list
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Fail the job if the published manifest does not actually advertise both
      # architectures -- the whole point of this workflow (issue #4).
      - name: Verify both architectures are published
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker manifest inspect "$tag" > /tmp/manifest.json
          jq -e '
            [.manifests[]
             | select(.platform.os == "linux")
             | .platform.architecture] | sort == ["amd64", "arm64"]
          ' /tmp/manifest.json
          echo "published platforms:"
          jq -r '.manifests[] | select(.platform.os == "linux") | "  \(.platform.os)/\(.platform.architecture)"' /tmp/manifest.json
